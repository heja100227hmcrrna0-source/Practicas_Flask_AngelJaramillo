<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectángulo</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
<header class="encabezado">
    <h1>Calculadora de Rectángulo con Flask</h1>

    <nav class="menu">
        <a href="/rectangulo">Rectángulo</a>
    </nav>
</header>

<main class="contenedor">
    <section class="tarjeta-operacion">
        <h2>Rectángulo</h2>

        <form method="POST">
            <label for="base">Base</label>
            <input id="base" name="base"
                   type="number" step="any" required>

            <label for="altura">Altura</label>
            <input id="altura" name="altura"
                   type="number" step="any" required>

            <button class="boton" type="submit">
                Calcular
            </button>
        </form>

        {% if area is not none %}
        <p class="resultado">
            Área: {{ area }}
        </p>
        <p class="resultado">
            Perímetro: {{ perimetro }}
        </p>
        {% endif %}
    </section>
</main>
</body>
</html>
